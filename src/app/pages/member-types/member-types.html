<div class="member-types-page">

  <div class="page-header">
    <h1>Member Types</h1>

    <button class="create-btn" (click)="openAddModal()">
      + Add Member Type
    </button>
  </div>

  <div class="table-wrapper">
    <table class="member-types-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Member Type</th>
          <th>Max Books Allowed</th>
          <th>Status</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of memberTypes">
          <td>{{ item.id }}</td>
          <td>{{ item.memberTypeName }}</td>
          <td>{{ item.maxBooksAllowed }}</td>
          <td>{{ item.isActive ? 'Active' : 'Inactive' }}</td>

          <td>
            <button class="edit-btn" (click)="openEditModal(item)">
              Edit
            </button>
          </td>

          <td>
            <button class="delete-btn" (click)="deleteMemberType(item.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="popup-overlay" *ngIf="showModal">
  <div class="popup-box">

    <div class="popup-header">
      <h2>{{ isEdit ? 'Edit Member Type' : 'Add Member Type' }}</h2>

      <button class="close-popup-btn" (click)="closeModal()">
        X
      </button>
    </div>

    <div class="form-group">
      <label>Member Type Name</label>
      <input type="text" [(ngModel)]="formData.memberTypeName">
    </div>

    <div class="form-group">
      <label>Max Books Allowed</label>
      <input type="number" [(ngModel)]="formData.maxBooksAllowed">
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" [(ngModel)]="formData.isActive">
        Active
      </label>
    </div>

    <div class="action-buttons">
      <button class="close-btn" (click)="closeModal()">Close</button>
      <button class="save-btn" (click)="saveMemberType()">Save</button>
    </div>

  </div>
</div>
